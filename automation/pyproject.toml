[project]
name = "mobile-qa-automation"
version = "0.1.0"
description = "Excel-driven QA automation framework for mobile apps: API, Flutter, evidence, triage, reporting."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "openpyxl>=3.1",
    "pydantic>=2.7",
    "pytest>=8.2",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/automation"]

[tool.pytest.ini_options]
testpaths = ["tests/framework"]
addopts = "-ra --strict-markers"
markers = [
    "destructive: changes data in the target environment",
    "sms: sends a real SMS",
    "lockout: can lock a test account",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Table-style test data (`# fmt: skip`) reads better on one line per row.
"tests/**" = ["E501"]
