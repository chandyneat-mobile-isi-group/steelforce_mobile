name: Deploy Web App to GitHub Pages

# Builds the Flutter Web target against the LIVE production API and publishes
# it to GitHub Pages. Users sign in with their real accounts and see real data.
#
# Repository: chandyneat-mobile-isi-group/steelforce_mobile
# Source branch: `web`
# Published:     https://chandyneat-mobile-isi-group.github.io/steelforce_mobile/
#
# Offline on web is session-scoped (ADR-010): business data lives in memory,
# never in browser storage. The app keeps working offline while the tab stays
# open; `web/offline_sw.js` caches only the app's own files so the installed
# app still opens without a connection.
#
# ── REQUIRED one-time setup ─────────────────────────────────────────────────
#
#   1. Settings → Pages → Build and deployment → Source: **GitHub Actions**.
#      While it is "Deploy from a branch", Pages ignores this workflow and
#      serves README.md through Jekyll instead.
#
#   2. Settings → Secrets and variables → Actions → **Variables** →
#      WEB_API_BASE_URL = https://<production API host>   (scheme + host only)
#      A variable, not a secret: the URL is readable in the published bundle by
#      anyone, so a secret would only pretend to hide it.
#
#   3. Backend: allow CORS from https://chandyneat-mobile-isi-group.github.io
#      (Authorization and Content-Type headers, the methods the app uses).
#      Without it the browser blocks every API call and sign-in fails.
#
#   4. Google Cloud: add https://chandyneat-mobile-isi-group.github.io/steelforce_mobile/*
#      to the HTTP-referrer allow-list of the Maps key in web/index.html.

on:
  push:
    # Released from `web`, not `main`, so ordinary work on `main` never changes
    # what users are running.
    branches: [web]
  workflow_dispatch:

# The repo-name segment the site is served under.
env:
  BASE_HREF: /steelforce_mobile/

permissions:
  contents: read
  pages: write
  id-token: write

# `cancel-in-progress: false` because cancelling a half-finished Pages
# deployment can leave the site broken — queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the version this build was verified against locally.
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Check API address is configured
        env:
          WEB_API_BASE_URL: ${{ vars.WEB_API_BASE_URL }}
        run: |
          [ -n "$WEB_API_BASE_URL" ] \
            || { echo "::error::Repository variable WEB_API_BASE_URL is not set — see the header of this workflow."; exit 1; }
          case "$WEB_API_BASE_URL" in
            https://*) ;;
            *) echo "::error::WEB_API_BASE_URL must start with https://"; exit 1 ;;
          esac

      - name: Write placeholder .env
        # ── This is a security control, not a convenience ──────────────────
        #
        # A web build is JavaScript: everything compiled into it is readable in
        # devtools, and Envied obfuscation buys nothing there
        # (`docs/skills/security.md` §4). So this job never receives `.env`
        # secrets. `DB_SALT` keys the SQLCipher database, which web does not
        # have (ADR-010), and must never reach a public bundle.
        #
        # The real API address arrives separately, as the `API_BASE_URL`
        # dart-define below, which `AppConfig.apiBaseUrl` prefers over `Env`.
        # The `.invalid` TLD (RFC 2606) means a code path that read `Env`
        # directly would fail loudly instead of reaching a real host.
        #
        # Never wire a repository secret into this job.
        run: |
          cat > .env <<'EOF'
          API_BASE_URL_DEV=https://unused.invalid
          API_BASE_URL_PRO=https://unused.invalid
          DB_SALT=web_build_has_no_encrypted_database_adr010
          EOF

      - run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        # Scoped to `lib/` — what ships. Warnings are not fatal; errors are.
        run: flutter analyze lib --no-fatal-warnings --no-fatal-infos

      - name: Build web (live API)
        # `APP_ENV=production` selects production config; `API_BASE_URL` is
        # the address, validated https-only by `AppConfig` in release builds.
        # `USE_MOCK_DATA` is left at its default (false): live data sources.
        #
        # `--base-href` makes every asset resolve under the repository sub-path.
        # `--no-web-resources-cdn` bundles CanvasKit so the CSP below can keep
        # `script-src 'self'` and the app shell can be cached for offline.
        # `--wasm` is NOT used: `flutter_secure_storage_web` and `geolocator_web`
        # still import legacy `dart:html`.
        env:
          WEB_API_BASE_URL: ${{ vars.WEB_API_BASE_URL }}
        run: |
          flutter build web --release \
            --base-href "$BASE_HREF" \
            --no-web-resources-cdn \
            --dart-define=APP_ENV=production \
            --dart-define=API_BASE_URL="$WEB_API_BASE_URL"

      - name: Inject Content Security Policy
        # Injected at deploy time rather than in web/index.html, because the
        # debug bootstrap (`flutter run -d chrome`) runs inline scripts any
        # policy worth having would block.
        #
        # `'wasm-unsafe-eval'`: CanvasKit and `sqlite3.wasm` instantiate
        # WebAssembly. It does NOT re-enable `eval()` for JavaScript.
        # `connect-src https:` covers the API host and Google Maps; `blob:` is
        # for `image_picker`, which returns photos as blob URLs.
        # `worker-src 'self'` allows `offline_sw.js`.
        # NOT included: `frame-ancestors`, which browsers ignore via <meta>.
        run: |
          set -e
          CSP="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://maps.googleapis.com https://maps.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https: blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'"
          TAG="<meta http-equiv=\"Content-Security-Policy\" content=\"$CSP\">"
          sed -i "0,/<head>/s|<head>|<head>\n  $TAG|" build/web/index.html
          grep -q "Content-Security-Policy" build/web/index.html \
            || { echo "::error::CSP injection failed — refusing to deploy without it."; exit 1; }
          echo "CSP injected."

      - name: Add SPA fallback
        # Pages serves 404.html for any unmatched path; as a copy of index.html
        # that becomes a correct app load for a hand-typed route.
        run: cp build/web/index.html build/web/404.html

      - name: Verify web assets
        run: |
          set -e
          test -f build/web/sqlite3.wasm \
            || { echo "::error::sqlite3.wasm missing — Drift cannot start on web. It must be committed at web/sqlite3.wasm."; exit 1; }
          grep -q 'base href="'"$BASE_HREF"'"' build/web/index.html \
            || { echo "::error::base href was not substituted; assets will 404 under the repository sub-path."; exit 1; }
          grep -q 'maps.googleapis.com/maps/api/js' build/web/index.html \
            || { echo "::error::Google Maps JS loader missing from build/web/index.html."; exit 1; }
          test -f build/web/offline_sw.js \
            || { echo "::error::offline_sw.js missing — the installed app will not open offline."; exit 1; }
          grep -q '_flutter.loader.load();' build/web/flutter_bootstrap.js \
            || { echo "::error::flutter_bootstrap.js is Flutter's default, which registers a self-unregistering service worker that removes offline_sw.js. web/flutter_bootstrap.js must be used."; exit 1; }
          echo "Web assets verified."

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
